<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: Huninn; src: url(huninn.ttf); }
html,body{margin:0;width:360px;height:640px;overflow:hidden;font-family:Huninn,sans-serif;color:#3a2e2a}
body{background:#fdf6e6;background-image:linear-gradient(90deg,transparent 0 26px,#f4b6b6 26px 28px,transparent 28px),repeating-linear-gradient(180deg,transparent 0 31px,#dbe7f3 31px 32px)}
#title{position:absolute;top:58px;left:0;right:0;text-align:center;font-size:52px;font-weight:700;letter-spacing:1px;text-shadow:4px 4px 0 #ffd96a;line-height:1.05}
#sub{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:20px;color:#8a7a72}
#cv{position:absolute;left:22px;top:262px;width:170px;height:221px}
#pencil{position:absolute;width:78px;left:0;top:0;transform-origin:50% 90%}
#robot{position:absolute;width:88px;left:262px;top:360px;transform-origin:50% 100%}
#haha{position:absolute;left:256px;top:318px;font-size:26px;font-weight:700;color:#e0566f;transform:rotate(-10deg)}
#cta{position:absolute;bottom:92px;left:0;right:0;text-align:center}
#cta .pill{display:inline-block;background:#ffb8c6;border:3px solid #3a2e2a;border-radius:24px;padding:8px 18px;font-size:21px;box-shadow:4px 4px 0 #3a2e2a}
#cta .url{margin-top:16px;font-size:16px;color:#4a7fc0}
</style></head><body>
<div id="title"></div><div id="sub"></div>
<canvas id="cv" width="600" height="780"></canvas>
<svg id="pencil" viewBox="0 0 90 220">
  <g stroke="#3a2e2a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="22" y="10" width="46" height="26" rx="10" fill="#ffb8c6"/>
    <rect x="22" y="34" width="46" height="12" fill="#cfcfcf"/>
    <path d="M22 46 h46 v118 h-46 z" fill="#ffd96a"/>
    <path d="M38 46 v118 M52 46 v118" fill="none" stroke-width="2"/>
    <path d="M22 164 L45 210 L68 164 z" fill="#f2d2a9"/>
    <path d="M37 194 L45 210 L53 194 z" fill="#3a2e2a"/>
    <path d="M16 70 q29 10 58 0 l2 16 q-31 10 -62 0 z" fill="#ff8fa3"/>
    <path d="M74 74 l14 -8 l-2 18 z" fill="#ff8fa3"/>
    <path d="M33 104 q12 10 24 0" fill="none"/>
    <path d="M22 110 q-14 6 -18 20 M68 110 q14 6 18 20" fill="none"/>
  </g>
</svg>
<svg id="robot" viewBox="0 0 110 150">
  <g stroke="#3a2e2a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M55 14 v14" /><circle cx="55" cy="10" r="6" fill="#ffb8c6"/>
    <rect x="12" y="28" width="86" height="64" rx="22" fill="#a9e5c6"/>
    <path d="M32 52 l10 6 l-10 6 M78 52 l-10 6 l10 6" fill="none"/>
    <path d="M38 72 q17 16 34 0 z" fill="#fff"/>
    <rect x="28" y="96" width="54" height="36" rx="12" fill="#aed5ff"/>
    <path d="M28 108 q-16 -4 -18 -18 M82 108 q16 -4 18 -18 M42 132 v14 M68 132 v14" fill="none"/>
    <path d="M10 46 q-6 4 -4 10 M100 46 q6 4 4 10" fill="none" stroke="#7fb6ff"/>
  </g>
</svg>
<div id="haha"></div>
<div id="cta"><div class="pill" id="pill"></div><div class="url" id="url"></div></div>
<script>
const P = new URLSearchParams(location.search), L = P.get('lang') || 'en', SCENE = P.get('scene') || 'intro';
const TXT = { en: { title: 'Blind Draw', sub: 'Draw it blind. Guess it live.', haha: 'HAHA', pill: 'Play free in your browser', url: 'mocha-cat-team.itch.io/blind-draw' },
              zh: { title: '盲畫', sub: '閉著眼睛畫，用心電感應猜', haha: '哈哈哈', pill: '免費・手機瀏覽器就能玩', url: 'mocha-cat-team.itch.io/blind-draw' } }[L];
title.textContent = TXT.title; sub.textContent = TXT.sub; haha.textContent = TXT.haha; pill.textContent = TXT.pill; url.textContent = TXT.url;
if (L === 'zh') { title.style.fontSize = '70px'; }
// 歪七扭八的貓（看不到畫面畫出來的那種）
const C = (cx, cy, r, n = 22, a0 = -1.2, sw = 2 * Math.PI) => Array.from({ length: n + 1 }, (_, i) => [cx + r * Math.cos(a0 + sw * i / n), cy + r * 1.08 * Math.sin(a0 + sw * i / n)]);
const CAT = [C(.46, .42, .24), [[.28, .3], [.26, .08], [.42, .22]], [[.56, .2], [.72, .1], [.7, .32]], [[.36, .4], [.37, .43]], [[.6, .37], [.61, .4]], [[.44, .52], [.5, .57], [.57, .5]],
  [[.25, .5], [.04, .44]], [[.68, .48], [.95, .42]], [[.3, .66], [.2, .95], [.8, .98], [.66, .64]], [[.82, .86], [.97, .7], [.92, .55]]];
const OFF = CAT.map((_, i) => [(i * 37 % 7 - 3) * .012, (i * 53 % 7 - 3) * .012]);
const pts = []; CAT.forEach((s, si) => s.forEach((p, k) => pts.push({ si, k, x: p[0] + OFF[si][0], y: p[1] + OFF[si][1] })));
const ctx = cv.getContext('2d');
function drawCat(frac) {
  ctx.clearRect(0, 0, 600, 780); ctx.lineWidth = 16; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#2a2320';
  const n = Math.floor(pts.length * frac); let last = null;
  for (let i = 0; i < n; i++) { const p = pts[i]; if (last && last.si === p.si) { ctx.beginPath(); ctx.moveTo(last.x * 600, last.y * 780); ctx.lineTo(p.x * 600, p.y * 780); ctx.stroke(); } last = p; }
  return n ? pts[Math.min(n, pts.length) - 1] : pts[0];
}
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const bounce = t => { t = Math.min(1, Math.max(0, t)); return t < .7 ? ease(t / .7) * 1.08 : 1.08 - .08 * ease((t - .7) / .3); };
window.render = t => {
  const intro = SCENE === 'intro';
  title.style.opacity = intro ? ease(t / .4) : 1; title.style.transform = `scale(${intro ? .7 + .3 * bounce(t / .5) : 1})`;
  sub.style.opacity = intro ? ease((t - .3) / .4) : 1;
  cta.style.display = intro ? 'none' : 'block'; cta.style.transform = `scale(${intro ? 1 : bounce(t / .5)})`;
  const frac = intro ? Math.min(1, Math.max(0, (t - .5) / 1.6)) : 1;
  const tip = drawCat(frac);
  // 鉛筆跟著線走，筆尖在最新的點上
  const tx = 22 + tip.x * 170, ty = 262 + tip.y * 221;
  const drop = intro ? (1 - bounce(t / .45)) * -300 : 0;
  pencil.style.left = (tx - 39) + 'px'; pencil.style.top = (ty - 178 + drop) + 'px';
  pencil.style.transform = `rotate(${12 + Math.sin(t * 22) * (frac < 1 ? 6 : 1)}deg)`;
  if (!intro || frac >= 1) { pencil.style.left = '186px'; pencil.style.top = '262px'; pencil.style.transform = `rotate(${8 + Math.sin(t * 8) * 3}deg)`; }
  const rt = intro ? (t - 2.1) / .4 : 1;
  robot.style.opacity = rt > 0 ? 1 : 0; haha.style.opacity = rt > .5 ? 1 : 0;
  robot.style.transform = `translateY(${(1 - bounce(rt)) * 200}px) rotate(${Math.sin(t * 30) * 7}deg) scaleY(${1 + Math.sin(t * 30) * .04})`;
  haha.style.transform = `rotate(${-10 + Math.sin(t * 18) * 6}deg) scale(${1 + Math.sin(t * 18) * .08})`;
};
render(0);
</script></body></html>
